<!--
Write a react application to create a student registraion form that accepts the
Student's Name,  age , and Email , and displays the submitted details below
the form using React
-->

<html>
<head>
  <title>Student Registration</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
  
 
   function App(){

	const [name,setName] = React.useState("");
	const [age,setAge] = React.useState("");
	const [email,setEmail] = React.useState("");


	const [submittedName,setSubmittedName] = React.useState("");
	const [submittedAge,setSubmittedAge] = React.useState("");
	const [submittedEmail,setSubmittedEmail] = React.useState("");
	

	const handleSubmit =(e) => {
	   e.preventDefault()

	   setSubmittedName(name);
	   setSubmittedAge(age);
	   setSubmittedEmail(email);
	}

	return(
	  <div>
	    <h2>Student Registration Form </h2>
	    <form onSubmit={handleSubmit}>
		<label>Name: </label>
		<input type="text" value={name} onChange={(e)=>setName(e.target.value)} />
		<br/>
		<label>Age: </label>
		<input type="number" value={age} onChange={(e)=>setAge(e.target.value)} />
		<br/><label>Email: </label>
		<input type="email" value={email} onChange={(e)=>setEmail(e.target.value)} />
		<br/>

		<input type="submit" value="Submit" />
	    </form>
	    <hr/>
	    <h3>Submitted Details</h3>
	    <p> Name: {submittedName} </p>
	    <p> Age: {submittedAge} </p>
	    <p> Email: {submittedEmail} </p>
	  </div>
	);
	}

	ReactDOM.render(<App/>,document.getElementById("root"));

</script>
</body>
</html>
